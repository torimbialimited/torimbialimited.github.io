<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="3; url=./index.html#intro" />
    <title>Thanks — Torimbia Ltd</title>
    <style type="text/css">
      .myClass {
        font-family: verdana;
        font-size: 16px;
        font-weight: normal;
        color: black;
        line-height: 30px;
      }
    </style>
  </head>
  <body>
    <script type="text/javascript">
      (function () {
        var timeLeft = 3;
        var cinterval;

        var timeDec = function countdownTick() {
          timeLeft--;
          document.getElementById("countdown").innerHTML = timeLeft;
          if (timeLeft === 0) {
            clearInterval(cinterval);
          }
        };

        cinterval = setInterval(timeDec, 1000);
      })();
    </script>

    <br /><br />

    <span class="myClass"
      >Thanks for your message, we'll get back to you soon! Taking you back to
      Torimbia in </span
    ><span id="countdown">3</span>
    <span class="myClass"> seconds...</span>

    <br />
    <br />

    <span class="myClass"
      >If you just can't wait, or you are not automatically redirected, just
      click the link below:</span
    >
    <span class="myClass">
      <a href="./index.html#intro">Torimbia Ltd Home</a>
    </span>
  </body>
</html>
